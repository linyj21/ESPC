<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESPC 計畫書匯入</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F1; --surface:#FFFFFF; --ink:#18302E; --muted:#5B6F6C; --line:#CFD9D7; --line-soft:#E3EAE8;
  --accent:#0E6560; --accent-ink:#FFFFFF; --accent-soft:#DDEEEC;
  --warn:#8A5300; --warn-bg:#FFF2D2; --warn-bar:#E0A12B;
  --info:#255B8C; --info-bg:#E6F0FA;
  --manual:#F6F8F8;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--ink);color:#F2F7F6;position:sticky;top:0;z-index:10}
header.top h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.02em}
header.top .sub{color:#A9C2BF;font-size:13px}
header.top .spacer{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#CFE0DE}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{background:#0B5450}
.btn.primary:disabled{background:#6C8A87;border-color:#6C8A87;cursor:not-allowed}
.btn.small{padding:3px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:#A1241B}

.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 56px)}
aside{border-right:1px solid var(--line);padding:18px;background:#E6ECEA}
main{padding:22px 28px 60px;min-width:0}

.drop{border:2px dashed #9DB3B0;border-radius:10px;padding:22px 14px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-size:15px}
.drop span{font-size:13px;color:var(--muted)}
.cases{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.cases li{border-radius:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;position:relative}
.cases li.active{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.cases .nm{font-weight:500;font-size:14px;padding-right:22px}
.cases .fn{font-size:12px;color:var(--muted);word-break:break-all}
.cases .badge{display:inline-block;margin-top:4px;font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:0 8px}
.cases .badge.ok{color:var(--accent);background:var(--accent-soft)}
.cases .del{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.cases .del:hover{color:#A1241B}
.side-note{font-size:12px;color:var(--muted);margin-top:18px}

.empty{max-width:560px;margin:60px auto;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}

.case-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.case-head h2{margin:0;font-size:22px}
.case-head .file{color:var(--muted);font-size:13px}

.checks{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:22px;overflow:hidden}
.checks summary{padding:10px 16px;cursor:pointer;font-weight:500;display:flex;gap:10px;align-items:center}
.checks summary .n{font-size:13px;font-weight:400;color:var(--muted)}
.checks ul{margin:0;padding:0 0 6px;list-style:none;max-height:320px;overflow:auto}
.checks li{padding:7px 16px 7px 30px;border-top:1px solid var(--line-soft);font-size:14px;position:relative}
.checks li::before{content:"";position:absolute;left:14px;top:14px;width:8px;height:8px;border-radius:50%}
.checks li.warn::before{background:var(--warn-bar)}
.checks li.info::before{background:#7FA7CF}
.checks li.live{background:#FFFBF0}
.checks li .tag{font-size:12px;color:var(--muted);margin-left:6px}

section.block{margin-bottom:26px}
section.block h3{font-size:15px;margin:0 0 8px;color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.f{display:flex;flex-direction:column;gap:3px;position:relative;padding-left:8px;border-left:3px solid transparent}
.f.flagged{border-left-color:var(--warn-bar)}
.f label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.f label .src{font-size:11px;color:#86A09C;white-space:nowrap}
.f input,.f select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);width:100%;min-width:0}
.f input:focus,.f select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f.manual input,.f.manual select{background:var(--manual);border-style:dashed}
.f.manual input::placeholder{color:#9AAEAB}
.f.computed input{background:var(--line-soft);border-color:var(--line-soft)}
.f.wide{grid-column:span 2}

.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px}
th{background:#E3EBE9;text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:4px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
td input,td select,td textarea{border:1px solid transparent;border-radius:4px;padding:4px 6px;width:100%;background:transparent}
td input:hover,td select:hover,td textarea:hover{border-color:var(--line)}
td input:focus,td select:focus,td textarea:focus{border-color:var(--accent);outline:none;background:#fff}
td textarea{resize:vertical;min-height:34px}
td.manual input{background:var(--manual)}
td.num input{text-align:right}
.tbl-actions{display:flex;gap:8px;margin-top:8px}
.w-xs{width:70px}.w-s{width:110px}.w-m{width:150px}.w-l{width:230px}.w-xl{width:380px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.busy{font-size:13px;color:var(--muted);margin-top:10px;min-height:1.4em}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  main{padding:18px 14px 50px}
  .f.wide{grid-column:auto}
  header.top{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>ESPC 計畫書匯入</h1>
    <div class="sub">上傳計畫書 → 核對欄位 → 匯出案件列表</div>
  </div>
  <div class="spacer"></div>
  <label class="chk"><input type="checkbox" id="withChecks" checked> 匯出時附加「檢核提醒」工作表</label>
  <button class="btn primary" id="exportBtn" disabled>匯出 Excel</button>
</header>
<div class="layout">
  <aside>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="選擇計畫書檔案">
      <strong>拖曳或點選上傳計畫書</strong>
      <span>支援 .docx、.pdf（可多選）</span>
    </div>
    <input type="file" id="file" accept=".docx,.pdf" multiple hidden>
    <div class="busy" id="busy" aria-live="polite"></div>
    <ul class="cases" id="cases"></ul>
    <p class="side-note">檔案只在這台電腦的瀏覽器中讀取，不會上傳到任何伺服器。資料不儲存，重新整理頁面即清空；同一單位再次上傳會直接覆蓋。</p>
  </aside>
  <main id="main">
    <div class="empty">
      <h2>尚未匯入計畫書</h2>
      <p>從左側上傳節能績效保證專案計畫書。系統會依計畫書範本抽取案件列表、優先項目、非優先項目三張表的內容，並標出需要確認的地方。</p>
      <p>舊版 .doc 請先在 Word 另存為 .docx。掃描成圖片的 PDF 無法讀取。</p>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.12.3/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ===== ESPC 計畫書抽取核心（瀏覽器與 Node 共用） ===== */
const COLS = {"main": ["案件編號", "年度", "批次", "單位名稱", "補助上限類型", "行業別類別", "行業別小分類", "行業別其他", "統一編號", "單位地址", "單位地址鄉鎮區", "單位地址街道路號", "中小企業", "是否位於工業區", "園區類型", "園區", "工廠登記證號", "負責人", "負責人職稱", "負責人電話", "負責人Email", "聯絡人", "聯絡人職稱", "聯絡人電話", "聯絡人手機", "聯絡人傳真", "聯絡人Email", "聯絡人地址縣市", "聯絡人地址鄉鎮區", "聯絡人地址街道路號", "承諾節能率(%)", "節約用電量(kWh/年)", "節省油當量(kLOE/年)", "tCO2減量(噸/年)", "節約金額(元/年)", "總用電度(度/年)", "總電費(元/年)", "舊機作為備機", "分期付款", "分期年數", "改善項目備註", "非優先專案總經費（元）", "非優先補助總經費（元）", "優先專案總經費（元）", "優先補助總經費（元）", "總計－專案總經費（元）", "總計－補助總經費（元）", "優先方案數", "非優先方案數", "總方案數", "第一期補助款（元）", "第一期預定時間", "第二期補助款（元）", "第二期預定時間", "第三期補助款（元）", "第三期預定時間"], "優先項目": ["案號", "申請用戶", "優先/非優先", "改善前耗電量(度)", "改善前耗電量(kLOE)", "改善前耗能量(kLOE)", "改善後耗電量(度)", "改善後耗電量(kLOE)", "改善後耗能量(kLOE)", "改善系統套數", "合計容量", "優先項目-專案經費(元)", "優先項目-補助經費(元)", "優先項目類型", "改善地點", "1級冰水機組合計容量(RT)", "是否有含區域泵", "空調系統合計容量(RT)", "空壓系統合計容量(HP)", "熱水系統合計容量(kW)", "冷凍(藏)庫合計容量(RT)", "承諾之再節電量(kWh/年)", "人工智慧機械設備系統合計容量(kW)", "績效指標", "內容概要描述"], "非優先項目": ["案號", "申請用戶", "優先/非優先", "改善前耗電量(度)", "改善前耗電量(kLOE)", "改善前耗能量(kLOE)", "改善後耗電量(度)", "改善後耗電量(kLOE)", "改善後耗能量(kLOE)", "改善地點", "改善措施"]};
const PRIORITY_TYPES = [
  '服務業中央空調系統：水側系統耗能指標值低於 0.75 kW/RT',
  '服務業中央空調系統：空氣側系統耗能指標值低於 0.25 kW/RT',
  '資料中心能源效率指標值 (PUE) 低於 1.5',
  '運用創能減少用電負載之設備技術',
  '建置能源管理系統 (Energy Management System；EMS)',
  '蒸氣壓縮式冰水機組能源效率分級標示 1 級之冰水機組',
  '冷凍(藏)庫系統化改善',
  '熱水系統改善為熱泵系統',
  '可整合人工智慧自動演算控制進而優化用於生產或加工之機械生產設備，提高生產效率或能源效率之機械設備'
];
const INDUSTRY = {
  '製造業': ['木竹製品製造業','紡織業','金屬加工業','食品加工業','生技醫療業','電機電子業','化工業','印刷業','塑膠製品製造業','航太業','化織業','玻璃業','食品業','鋼鐵業','金屬業','其他製造業','汽車及其零件製造業','電子零組件製造業','其他'],
  '服務業': ['批發零售業','公共行政業','藝術、娛樂及休閒服務業','運輸倉儲業','教育服務業','住宿餐飲業','醫療保健業','物流業','金融保險業','研究機構','殯葬業','其他'],
  '醫院': ['公立醫院','私立醫院'],
  '學校': ['公立學校','私立學校'],
  '政府機關': []
};
// 系統不產出、僅保留空白欄位
const MANUAL_ONLY = ['案件編號','年度','批次','舊機作為備機','分期付款','分期年數','改善項目備註'];
const COMPUTED = ['總計－專案總經費（元）','總計－補助總經費（元）','優先方案數','非優先方案數','總方案數'];
const NUMERIC_MAIN = ['承諾節能率(%)','節約用電量(kWh/年)','節省油當量(kLOE/年)','tCO2減量(噸/年)','節約金額(元/年)','總用電度(度/年)','總電費(元/年)','非優先專案總經費（元）','非優先補助總經費（元）','優先專案總經費（元）','優先補助總經費（元）','總計－專案總經費（元）','總計－補助總經費（元）','優先方案數','非優先方案數','總方案數','第一期補助款（元）','第二期補助款（元）','第三期補助款（元）'];
const NUMERIC_ITEM = ['改善前耗電量(度)','改善前耗電量(kLOE)','改善前耗能量(kLOE)','改善後耗電量(度)','改善後耗電量(kLOE)','改善後耗能量(kLOE)','改善系統套數','合計容量','優先項目-專案經費(元)','優先項目-補助經費(元)','1級冰水機組合計容量(RT)','空調系統合計容量(RT)','空壓系統合計容量(HP)','熱水系統合計容量(kW)','冷凍(藏)庫合計容量(RT)','承諾之再節電量(kWh/年)','人工智慧機械設備系統合計容量(kW)'];
const KLOE_PER_KWH = 860/9000000;
const AC_TYPES = [0,1,5];

/* ---------- 文字前處理 ---------- */
function norm(s){
  s=s.normalize('NFKC').replace(/\u00a0/g,' ').replace(/[ \u3000]+/g,' ');
  // PDF 常見「工 廠 登 記」字距：連續單字中文之間的空白移除
  return s.replace(/(?:[\u4e00-\u9fff(:)] ){2,}[\u4e00-\u9fff(:)]/g, m=>m.replace(/ /g,''));
}
function htmlToLines(html){
  html = html.replace(/<img[^>]*>/g,'');
  html = html.replace(/<td[^>]*>([\s\S]*?)<\/td>/g,(m,c)=>'<td>'+c.replace(/<\/p>\s*<p[^>]*>/g,' ').replace(/<br\s*\/?>/g,' ').replace(/<\/?p[^>]*>/g,'')+'</td>');
  let h = html.replace(/<\/(td|th)>/g,'\t').replace(/<\/tr>/g,'\n').replace(/<\/(p|h\d|li|table)>/g,'\n').replace(/<br\s*\/?>/g,'\n');
  h = h.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ');
  return h.split('\n').map(l=>norm(l).replace(/[ \t]+$/,'').replace(/^ +/,'')).filter(l=>l.replace(/\t/g,'').trim());
}
function pdfItemsToLines(items){
  const rows=[];
  for(const it of items){ if(!it.str || !it.str.trim()) continue; const y=it.transform[5], x=it.transform[4];
    let r=rows.find(r=>Math.abs(r.y-y)<3); if(!r){ r={y,items:[]}; rows.push(r); } r.items.push({x,w:it.width,s:it.str}); }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{ r.items.sort((a,b)=>a.x-b.x); let out='',end=null;
    for(const i of r.items){ if(end!==null && i.x-end>4) out+=' '; out+=i.s; end=i.x+i.w; }
    return norm(out).trim(); }).filter(Boolean);
}

/* ---------- 小工具 ---------- */
const NUM_RE = /-?\d[\d,]*(?:\.\d+)?/g;
function toNum(s){ if(s===null||s===undefined||s==='') return null; const n=Number(String(s).replace(/,/g,'')); return isFinite(n)?n:null; }
function nums(s){ return (s.match(NUM_RE)||[]).map(toNum); }
function fmt(n){ return n===null||n===undefined||n==='' ? '' : Number(n).toLocaleString('zh-TW',{maximumFractionDigits:4}); }
function splitAddress(a){
  a=(a||'').replace(/\s+/g,'').replace(/^\([^)]*\)/,'').replace(/^\d{3,6}(?=\D)/,'').replace(/^臺/,'臺');
  const m=a.match(/^(.{2}[縣市])(.{1,4}?[鄉鎮市區])(.+)$/);
  return m?[m[1],m[2],m[3]]:[a,'',''];
}
function cells(l){ return l.split('\t').map(c=>c.trim()); }
function findIdx(lines, re, from=0, to=lines.length){ for(let i=from;i<Math.min(to,lines.length);i++) if(re.test(lines[i])) return i; return -1; }
function findLastIdx(lines, re){ for(let i=lines.length-1;i>=0;i--) if(re.test(lines[i])) return i; return -1; }
function rocMonth(s){
  if(!s) return '';
  let m=s.match(/(\d{2,3})\s*年\s*(\d{1,2})\s*月/) || s.match(/(\d{2,3})\/(\d{1,2})/);
  return m? m[1]+'/'+String(m[2]).padStart(2,'0') : '';
}
function classifyType(t){
  t=(t||'').replace(/\s+/g,'');
  if(/水側/.test(t)) return 0;
  if(/空氣側/.test(t)) return 1;
  if(/PUE|資料中心/i.test(t)) return 2;
  if(/創能/.test(t)) return 3;
  if(/(1|一)級(能效)?.{0,6}冰水機組|分級標示1級/.test(t)) return 5;
  if(/冷凍|冷藏/.test(t)) return 6;
  if(/熱泵/.test(t)) return 7;
  if(/人工智慧/.test(t)) return 8;
  if(/能源管理系統|EMS/.test(t)) return 4;
  return -1;
}

/* ---------- 主抽取 ---------- */
function extract(lines, fileName){
  const flags=[]; const src={};
  const flag=(level,msg,field)=>flags.push({level,msg,field:field||null});
  const M={}; COLS.main.forEach(c=>M[c]='');
  const set=(k,v,s)=>{ if(v===null||v===undefined||v==='') return; M[k]=v; if(s) src[k]=s; };
  const all=lines.join('\n');
  const flat=lines.join(' ');

  // 封面與摘要表區域
  const iSum = findIdx(lines,/摘要表/);
  const iToc = findIdx(lines,/^目\s*錄/, iSum>0?iSum:0);
  const cover = lines.slice(0, iSum>0?iSum:40);
  const sumLines = lines.slice(iSum>0?iSum:0, iToc>0?iToc:(iSum>0?iSum+40:60));

  // 單位名稱
  let name='';
  for(const l of sumLines){ const m=l.match(/^單位名稱\s*\t?\s*(.+)$/); if(m){ name=m[1].replace(/\t/g,' ').replace(/^[:\s]+/,'').trim(); break; } }
  if(!name){ const m=all.match(/申請(?:機關|單位)名稱\s*:\s*([^\n\t]+)/); if(m) name=m[1].trim(); }
  set('單位名稱',name,'摘要表');

  // 統一編號
  const tax = all.match(/統一編號\s*:?\s*(\d{8})/);
  if(tax) set('統一編號',tax[1],'封面');

  // 單位地址（封面第一個地址）
  const ai = findIdx(lines,/申請(?:機關|單位)地址\s*:/);
  if(ai>=0){ const a=lines[ai].replace(/^.*?地址\s*:\s*/,''); const [c,d,s]=splitAddress(a);
    set('單位地址',c,'封面'); set('單位地址鄉鎮區',d,'封面'); set('單位地址街道路號',s,'封面'); }

  // 行業別（封面勾選）
  let mfgStart = cover.findIndex(l=>/法人\(製造業\)/.test(l.replace(/\s+/g,'')));
  cover.forEach((l,li)=>{
    const re=/■\s*([^□■]+)/g; let m;
    while((m=re.exec(l))){
      let opt=m[1].trim(); let other='';
      const om=opt.match(/^其他\s*\(\s*請填寫\s*:?\s*([^)]*)\)?/);
      if(om){ other=om[1].trim(); opt='其他'; }
      const cat = (mfgStart>=0 && li>mfgStart) ? '製造業' : '服務業';
      let sub = INDUSTRY[cat].find(o=>opt.replace(/\s/g,'').startsWith(o.replace(/\s/g,'')));
      if(!sub){ // 以清單比對
        for(const c of ['製造業','服務業']){ const f=INDUSTRY[c].find(o=>opt.replace(/\s/g,'').startsWith(o)); if(f){ sub=f; } }
      }
      if(sub){ set('行業別類別', INDUSTRY['製造業'].includes(sub)&&sub!=='其他'?'製造業':cat, '封面勾選'); set('行業別小分類',sub,'封面勾選'); if(other) set('行業別其他',other,'封面勾選'); }
    }
  });
  if(!M['行業別類別']) flag('warn','封面未找到行業別勾選，請手動選擇（醫院／學校／政府機關無勾選框）。','行業別類別');
  else if(['教育服務業','醫療保健業','公共行政業'].includes(M['行業別小分類']))
    flag('info',`封面勾選「${M['行業別小分類']}」。若此單位屬學校、醫院或政府機關，請手動改為對應類別。`,'行業別類別');

  // 負責人、聯絡人
  const sumText = sumLines.join('\n');
  const LABEL_RE=/(姓名|職稱|辦公電話|電話|傳真|手機|E-?mail|通訊地址)\s*:/gi;
  const STOP_WORDS=/^(計畫|聯絡人|單位|負責人|計畫聯絡人|單位負責人)$/;
  function parsePeople(segLines){
    const out={}; const order=[];
    segLines.forEach((l,li)=>{
      const hits=[...l.matchAll(LABEL_RE)];
      if(!hits.length){
        // 分機獨立一行
        if(/^#\d+$/.test(l.trim()) && out['電話'] && !out['電話'].v.includes('#')) out['電話'].v+=l.trim();
        return;
      }
      hits.forEach((h,hi)=>{
        let lab=h[1].replace(/^辦公/,''); if(/mail/i.test(lab)) lab='Email';
        const end = hi+1<hits.length? hits[hi+1].index : l.length;
        const v=l.slice(h.index+h[0].length,end).replace(/\t/g,' ').trim();
        if(out[lab]) return; out[lab]={v,li}; order.push(lab);
      });
      // PDF 表格斷行：值以「-」結尾或 Email 空白時，由下一行的零散文字依序補上
      const incomplete=hits.map(h=>{ let lab=h[1].replace(/^辦公/,''); if(/mail/i.test(lab)) lab='Email'; return lab; })
        .filter(lab=>out[lab] && out[lab].li===li && (/-$/.test(out[lab].v) || (lab==='Email' && !/@.+\./.test(out[lab].v))));
      LABEL_RE.lastIndex=0;
      let nx=-1; for(let q=li+1;q<=li+2&&q<segLines.length;q++){ LABEL_RE.lastIndex=0; if(!LABEL_RE.test(segLines[q])){ nx=q; break; } }
      LABEL_RE.lastIndex=0;
      if(incomplete.length && nx>0){
        const toks=segLines[nx].split(/[\t ]+/).filter(t=>t && !STOP_WORDS.test(t));
        for(const lab of incomplete){
          const idx = lab==='Email' ? toks.findIndex(t=>/@/.test(t)||/^[A-Za-z0-9.\-]+\.[a-z]{2,}$/i.test(t)) : toks.findIndex(t=>/^[\d#()\-]+$/.test(t));
          if(idx>=0){ out[lab].v+=toks[idx]; toks.splice(idx,1); }
        }
      }
      LABEL_RE.lastIndex=0;
    });
    const g=k=>out[k]? out[k].v : '';
    const clean=s=>s.replace(/\s+/g,'');
    const firstWord=s=>(s.split(/\s+/)[0]||'');
    const phoneOnly=s=>{ const m=clean(s).match(/[0-9(][0-9()\-#]{5,}/); return m? m[0].replace(/-+$/,''):''; };
    let email=clean(g('Email')); const em=email.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/); email=em?em[0]:'';
    return {name:firstWord(g('姓名')), title:firstWord(g('職稱')), tel:phoneOnly(g('電話')), fax:phoneOnly(g('傳真')), mobile:phoneOnly(g('手機')), email, addr:g('通訊地址')};
  }
  // 負責人：單位名稱之後到「申請經費／預定期程」；聯絡人：承諾節能率之後到「備註」
  const iName=sumLines.findIndex(l=>/^單位名稱/.test(l));
  const iFund=sumLines.findIndex((l,i)=>i>iName && /申請經費|預定期程|經\s*費/.test(l));
  const iRate=sumLines.findIndex(l=>/承諾之?節能率/.test(l));
  const iNote=sumLines.findIndex((l,i)=>i>Math.max(iRate,0) && /^備\s*註/.test(l));
  const nameIdx=[]; sumLines.forEach((l,i)=>{ if(/姓名\s*:/.test(l)) nameIdx.push(i); });
  let bossSeg = (iName>=0 && iFund>iName)? sumLines.slice(iName+1,iFund) : [];
  if(!bossSeg.some(l=>/姓名\s*:/.test(l)) && nameIdx.length) bossSeg=sumLines.slice(nameIdx[0], nameIdx[1]!==undefined?nameIdx[1]:nameIdx[0]+6);
  let ctSeg = (iRate>=0)? sumLines.slice(iRate+1, iNote>iRate?iNote:iRate+10) : [];
  if(!ctSeg.some(l=>/姓名\s*:/.test(l)) && nameIdx.length>1) ctSeg=sumLines.slice(nameIdx[1], iNote>nameIdx[1]?iNote:nameIdx[1]+8);
  if(bossSeg.length){ const b=parsePeople(bossSeg);
    set('負責人',b.name,'摘要表'); set('負責人職稱',b.title,'摘要表'); set('負責人電話',b.tel,'摘要表'); set('負責人Email',b.email,'摘要表'); }
  if(!M['負責人Email']) flag('warn','摘要表中找不到負責人 Email。','負責人Email');
  if(ctSeg.length){ const c=parsePeople(ctSeg);
    set('聯絡人',c.name,'摘要表'); set('聯絡人職稱',c.title,'摘要表'); set('聯絡人電話',c.tel,'摘要表'); set('聯絡人手機',c.mobile,'摘要表'); set('聯絡人傳真',c.fax,'摘要表'); set('聯絡人Email',c.email,'摘要表');
    if(c.addr){ const [x,y,z]=splitAddress(c.addr); set('聯絡人地址縣市',x,'摘要表'); set('聯絡人地址鄉鎮區',y,'摘要表'); set('聯絡人地址街道路號',z,'摘要表'); }
  } else flag('warn','摘要表中找不到計畫聯絡人資料。','聯絡人');
  if(ctSeg.length && !M['聯絡人Email']) flag('warn','摘要表中找不到聯絡人 Email。','聯絡人Email');

  // 承諾節能率
  const rate = sumText.replace(/\s+/g,'').match(/承諾之?節能率[^\d]*([\d.]+)\[?%/);
  if(rate) set('承諾節能率(%)',toNum(rate[1]),'摘要表');

  // 分期補助款
  const sumFlat=sumLines.join(' ');
  ['一','二','三'].forEach((ch,k)=>{
    const re=new RegExp('第'+ch+'次[^\\d]*?(?:\\(\\d+%\\)\\s*)?([\\d,]{3,})\\s+(\\d{2,3}(?:\\s*年\\s*\\d{1,2}\\s*月|\\/\\d{1,2}(?:\\/\\d{1,2})?))');
    const m=sumFlat.match(re);
    if(m){ const lab=['第一期','第二期','第三期'][k]; set(lab+'補助款（元）',toNum(m[1]),'摘要表'); set(lab+'預定時間',rocMonth(m[2]),'摘要表'); }
  });

  // 中小企業
  const sme = all.match(/■\s*本案\s*(非屬|屬)\s*中小企業/);
  if(sme) set('中小企業', sme[1]==='屬'?'是':'否','經費章勾選'); else flag('warn','找不到中小企業勾選。','中小企業');

  // 製造業才有：工業區、園區、工廠登記
  if(M['行業別類別']==='製造業'){
    const f=all.match(/工廠登記(?:證)?(?:號碼|編號|證號|號)?\s*:\s*([^\n]+)/) || all.match(/工廠登記(?:證)?(?:號碼|編號|證號|號)?\s*([A-Za-z0-9\-]{6,})/);
    if(f){ const v=f[1].replace(/\s*\/\s*/g,'/').replace(/\s+/g,' ').trim(); if(/\d{6,}/.test(v)) set('工廠登記證號',v,'封面'); }
    const zl=all.match(/(?:^|\n)\s*(?:所在)?(?:工業區|園區)\s*:\s*([^\n]+)/);
    const z = zl? zl[1].replace(/\s*\/\s*/g,'/').trim() : ((flat.match(/([^\s,、()「」:]{2,12}(?:工業區|科學園區|加工出口區|科技產業園區))/)||[])[1]);
    if(z){ set('是否位於工業區','是','計畫書'); set('園區',z,zl?'封面':'計畫書'); flag('info','偵測到園區名稱，請確認「園區類型」。','園區類型'); }
  }

  // 第壹章：總用電度、總電費（多場址加總；若文中已有合計則採合計）
  const iCh2 = findLastIdx(lines,/^第\s*貳\s*章/);
  const ch1 = lines.slice(0, iCh2>0?iCh2:lines.length).join(' ');
  const dedupTotal=a=>{ const t=a.find(x=>Math.abs(a.filter(y=>y!==x).reduce((s,y)=>s+y,0)-x)<=1); return (t!==undefined && a.length>2)? [t] : a; };
  const kwhAll=[...new Set([...ch1.matchAll(/(?:全年(?:度)?(?:總)?用電(?:度數|量)?|共使用)\s*[:為]?\s*([\d,]{4,})\s*kWh/gi)].map(m=>toNum(m[1])))];
  const feeAll=[...new Set([...ch1.matchAll(/總電費\s*[:為]?\s*([\d,]{4,})\s*元/g)].map(m=>toNum(m[1])))];
  const kwh=dedupTotal(kwhAll), fee=dedupTotal(feeAll);
  if(kwh.length){ set('總用電度(度/年)',kwh.reduce((a,b)=>a+b,0),'第壹章'); if(kwh.length>1) flag('info',`總用電度為 ${kwh.length} 個場址加總：${kwh.map(fmt).join(' + ')}`,'總用電度(度/年)'); else if(kwhAll.length>1) flag('info','總用電度採第壹章所列各場址合計值。','總用電度(度/年)'); }
  else flag('warn','第壹章找不到全年用電度數。','總用電度(度/年)');
  if(fee.length){ set('總電費(元/年)',fee.reduce((a,b)=>a+b,0),'第壹章'); if(fee.length>1) flag('info',`總電費為 ${fee.length} 個場址加總：${fee.map(fmt).join(' + ')}`,'總電費(元/年)'); }

  // 能源使用狀況表（依數值關係辨識各列，不依賴列標題格式）
  const isNumTok=t=>/^-?[\d,]*\d(?:\.\d+)?%?$/.test(t);
  function trail(l){ const toks=l.split(/[\t ]+/).filter(Boolean); let k=toks.length; while(k>0 && isNumTok(toks[k-1])) k--;
    const nt=toks.slice(k); return {label:toks.slice(0,k).join(' '), vals:nt.map(x=>toNum(x.replace('%',''))), pct:nt.length>0 && nt.every(x=>x.endsWith('%'))}; }
  const near=(a,b,tol)=> Math.abs(a-b) <= Math.max(tol.abs||0, Math.abs(b)*(tol.rel||0));
  const rowsNear=(A,B,f,tol)=> A.length===B.length && A.every((x,i)=> B[i]===0 && x===0 || near(x, f(B[i],i), tol));
  let energy=null;
  (function(){
    const heads=[]; lines.forEach((l,i)=>{ if(/^表\s*\S{0,8}.{0,50}能源使用狀況/.test(l.replace(/\s+/g,''))||/^表.{0,60}能源使用狀況/.test(l)) heads.push(i); });
    const iPre0=findIdx(lines,/^1\s*、\s*改善前(耗[能電]|用電)(?!金額)/); if(iPre0>=0) heads.push(Math.max(0,iPre0-12));
    for(const h of heads){
      const rows=[]; let acc=[]; const region=[];
      for(let i=h+1;i<Math.min(lines.length,h+90);i++){
        const l=lines[i];
        if(rows.length>=3 && (/^(備註|註)\s*[:\d]/.test(l) || /^表\s*\S/.test(l))) break;
        const t=trail(l); region.push({l,t});
        if(t.vals.length>=2){ rows.push({...t, idx:i, pre:acc.join(' ')}); acc=[]; }
        else { acc.push(l); if(rows.length) rows[rows.length-1].post=(rows[rows.length-1].post||'')+' '+l; }
      }
      if(rows.length<4) continue;
      const cnt={}; rows.forEach(r=>cnt[r.vals.length]=(cnt[r.vals.length]||0)+1);
      const NT=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
      const hdr=[]; for(const x of region){ if(x.t.vals.length===NT) break; if(x.t.vals.length<2) hdr.push(x.l); }
      const R=rows.filter(r=>r.vals.length===NT);
      const V=R.filter(r=>!r.pct);
      // 找「前 − 後 = 節約」的三列組合
      const triples=[];
      for(let i=0;i<V.length;i++) for(let j=i+1;j<V.length;j++) for(let k=j+1;k<V.length;k++){
        const a=V[i].vals,b=V[j].vals,c=V[k].vals;
        if(a.every((x,q)=>near(x-b[q],c[q],{abs:1.5,rel:0.002})) && a.some(x=>x>=100)) triples.push([V[i],V[j],V[k]]); }
      const kloeOf=(row)=>V.find(r=>r!==row && rowsNear(r.vals,row.vals,(x)=>x*KLOE_PER_KWH,{abs:0.06,rel:0.03}));
      let kT=triples.find(t=>kloeOf(t[0])&&kloeOf(t[1]));
      if(!kT) continue;
      const mT=triples.find(t=>t!==kT && t[0].vals.every((x,q)=>kT[0].vals[q]===0 || (x/kT[0].vals[q]>1.5 && x/kT[0].vals[q]<9)));
      const co2=V.find(r=>/co2\s*減量/i.test(r.label+' '+r.pre)) || V.find(r=>r!==kT[2] && rowsNear(r.vals,kT[2].vals,x=>x*0.474/1000,{abs:0.2,rel:0.1}));
      const pcts=R.filter(r=>r.pct); const rateRow=pcts.find(r=>/耗能基準/.test(r.label+' '+r.pre+' '+(r.post||'')))||pcts[pcts.length-1];
      const total = NT>=2 && Math.abs(kT[0].vals.slice(0,-1).reduce((a,b)=>a+b,0)-kT[0].vals[NT-1])<=Math.max(1,kT[0].vals[NT-1]*0.001);
      const N = total? NT-1 : NT;
      const cut=a=>a? a.slice(0,N):null, last=a=>a? a[a.length-1]:null;
      // 表頭：場址與各欄說明
      const GENERIC=/^(改善地點|設備能源耗用(位置)?|合計|能源單價|\(元\/kWh\)|\(元\/kwh\))$/i;
      let siteToks=[]; const colText=Array(N).fill('');
      let expectSites=false;
      hdr.forEach(l=>{
        if(/單價/.test(l)) return;
        let t=l.includes('\t')? cells(l) : l.split(' ');
        if(/^改善地點/.test(t[0])){ t=t.slice(1); if(!t.length){ expectSites=true; return; } }
        t=t.map(x=>x.trim()).filter(x=>x && !GENERIC.test(x));
        if(!t.length) return;
        if(t.length===1 && N>1 && t[0]===name) return;
        if(expectSites || (/^改善地點/.test(l))){ siteToks=t; expectSites=false; return; }
        if(t.length===N) t.forEach((x,q)=>colText[q]+=x);
        else if(N===1) colText[0]+=(colText[0]?' ':'')+t.join(' ');
      });
      if(!siteToks.length){ const sl=hdr.find(l=>/^改善地點/.test(l)); if(sl) siteToks=(sl.includes('\t')?cells(sl):sl.split(' ')).slice(1).filter(x=>x&&!GENERIC.test(x)); }
      energy={N,total, R:{pre:cut(kT[0].vals),post:cut(kT[1].vals),sav:cut(kT[2].vals),preK:cut(kloeOf(kT[0]).vals),postK:cut(kloeOf(kT[1]).vals),
        savK:(kloeOf(kT[2])||{}).vals||null, savF:mT?mT[2].vals:null, co2:co2?co2.vals:null, rate:rateRow?rateRow.vals:null},
        siteToks, colText, prio:colText.map(t=>/非優先/.test(t)?'非優先':'優先'), head:h};
      energy.last={sav:last(kT[2].vals), savK:last(energy.R.savK), savF:last(energy.R.savF), co2:last(energy.R.co2), rate:last(energy.R.rate)};
      break;
    }
  })();
  if(energy){
    set('節約用電量(kWh/年)', energy.last.sav,'能源使用狀況表');
    set('節省油當量(kLOE/年)', energy.last.savK,'能源使用狀況表');
    set('tCO2減量(噸/年)', energy.last.co2,'能源使用狀況表');
    set('節約金額(元/年)', energy.last.savF,'能源使用狀況表');
    const rE=energy.last.rate;
    if(rE!==null && M['承諾節能率(%)']!=='' && Math.abs(rE-M['承諾節能率(%)'])>0.05) flag('warn',`摘要表承諾節能率 ${M['承諾節能率(%)']}% 與能源使用狀況表 ${rE}% 不一致。`,'承諾節能率(%)');
    if(energy.last.co2===null) flag('warn','能源使用狀況表中找不到 CO2 減量，請手動填寫。','tCO2減量(噸/年)');
    if(energy.last.savF===null) flag('warn','能源使用狀況表中找不到節約金額，請手動填寫。','節約金額(元/年)');
  } else flag('warn','找不到能源使用狀況表，節能效益與項目數值需手動填寫。');
  // 效益表交叉檢查（原則：以能源使用狀況表為準）
  const iBen = findIdx(lines,/效益表/);
  if(iBen>=0){
    const iTot = findIdx(lines,/^合\s*計/,iBen,iBen+25);
    if(iTot>=0){
      const v=nums(lines[iTot]);
      const chk=[['節約用電量(kWh/年)','節約用電量'],['節約金額(元/年)','節約金額'],['節省油當量(kLOE/年)','節省油當量'],['tCO2減量(噸/年)','CO2 減量']];
      const miss=[]; for(const [k,lab] of chk){ const x=M[k]; if(x==='') continue; if(!v.some(n=>Math.abs(n-x)<=Math.max(0.051,Math.abs(x)*0.0005))) miss.push(`${lab} ${fmt(x)}`); }
      if(miss.length) flag('warn',`效益表合計列與能源使用狀況表不一致：效益表未出現 ${miss.join('、')}（效益表合計列數值：${v.map(fmt).join('、')}）。已採用能源使用狀況表數值。`);
    }
  }

  // 經費：依標題找各預算表合計
  const budget={};
  const iCh5 = findLastIdx(lines,/^第\s*伍\s*章/);
  const heads=[]; lines.forEach((l,i)=>{ if(i<iCh5) return; const t=l.replace(/\s+/g,''); if(t.length<40 && /費用/.test(t) && /優先/.test(t) && !/推廣|比例/.test(t)) heads.push({i,np:/非優先/.test(t)}); });
  for(const h of heads){ const k=h.np?'np':'p'; if(budget[k]) continue;
    const it=findIdx(lines,/^合\s*計/,h.i+1,h.i+80); if(it>=0){ const v=nums(lines[it]); if(v.length) budget[k]={total:v[0], from:h.i, to:it}; } }
  if(!budget.p && !budget.np){ const m=all.match(/預計總經費[^\d]*([\d,]{5,})/); if(m){ budget.p={total:toNum(m[1]),from:-1,to:-1}; flag('warn','找不到優先／非優先預算表，暫以「預計總經費」列為優先專案總經費，請確認。','優先專案總經費（元）'); } }
  // 補助計算式 a × b% = c
  const triples=[]; const tre=[/([\d,]{5,})\s*[×xX*]\s*(\d+(?:\.\d+)?)\s*%\s*=\s*([\d,]{3,})/g, /([\d,]{5,})\s+(\d+(?:\.\d+)?)\s*%\s+([\d,]{3,})/g];
  lines.slice(iCh5>0?iCh5:0).forEach(l=>tre.forEach(re=>{ let m; re.lastIndex=0; while((m=re.exec(l))){ const a=toNum(m[1]),b=toNum(m[2]),c=toNum(m[3]); if(Math.abs(a*b/100-c)<=1.5) triples.push({a,b,c}); } }));
  const sub={};
  for(const k of ['p','np']){ if(!budget[k]) continue; const t=triples.find(x=>x.a===budget[k].total); if(t){ sub[k]=t.c; budget[k].pct=t.b; } }
  if(budget.p){ set('優先專案總經費（元）',budget.p.total,'優先項目預算表'); }
  if(budget.np){ set('非優先專案總經費（元）',budget.np.total,'非優先項目預算表'); }
  const smeYes=M['中小企業']==='是';
  for(const k of ['p','np']){ if(!budget[k]) continue; const key=k==='p'?'優先補助總經費（元）':'非優先補助總經費（元）';
    if(sub[k]!==undefined) set(key,sub[k],'補助費用初估表');
    else { const r=(k==='p'?(smeYes?40:30):(smeYes?30:20)); set(key,Math.round(budget[k].total*r/100),'依比例試算'); flag('warn',`找不到${k==='p'?'優先':'非優先'}補助計算式，已依${smeYes?'中小企業':'非中小企業'}比例 ${r}% 試算。`,key); }
    const exp = k==='p'?(smeYes?40:30):(smeYes?30:20);
    if(budget[k].pct!==undefined && budget[k].pct!==exp) flag('warn',`中小企業勾選為「${M['中小企業']}」，${k==='p'?'優先':'非優先'}項目應以 ${exp}% 計算，但計畫書採用 ${budget[k].pct}%。`,'中小企業');
  }
  const capM = all.match(/上限\s*[^\d\n]{0,15}([\d,.]+)\s*(萬)?/);
  const capVal = capM? Math.round(toNum(capM[1])*(capM[2]?10000:1)) : null;

  // 執行概要表：依出現順序取得（場址, 優先/非優先）
  const exeSeq=[]; const np=[]; const summaryPrio=new Set(), summaryNP=new Set();
  const iExe = findIdx(lines,/執行概要/, iCh2>0?iCh2:0);
  const siteSet = energy? energy.siteToks : [];
  if(iExe>=0){
    let cur=''; let hdrN=0;
    for(let i=iExe+1;i<Math.min(lines.length,iExe+80);i++){
      const l=lines[i]; if(/效益表|預估.{0,10}節能率/.test(l) || (/^表\s*[\(\d]/.test(l) && i>iExe+1)) break;
      const re=/(非)?優先(?:示範|補助)?項目/g; let m;
      while((m=re.exec(l))){
        const find=s=>siteSet.find(x=>s.includes(x));
        let site=find(l.slice(0,m.index+m[0].length)) || find(l) || find(lines[i+1]||'') || find(lines[i+2]||'') || (l.includes('\t')&&cells(l)[0]&&!/優先/.test(cells(l)[0])?cells(l)[0]:'') || cur;
        cur=site; exeSeq.push({site, prio:m[1]?'非優先':'優先'});
      }
      // Word 表格：擷取非優先列的改善措施（改善地點欄合併儲存格時沿用上一列）
      if(l.includes('\t')){
        const c=cells(l);
        if(!hdrN){ if(/改善措施/.test(l)) hdrN=c.length; continue; }
        let site, measure, rest;
        if(c.length>=hdrN){ site=c[0]||cur; measure=c[1]; rest=c.slice(2); } else { site=cur; measure=c[0]; rest=c.slice(1); }
        if(/非優先/.test(measure)){ summaryNP.add(site); np.push({site, measure:measure.replace(/\s*\(非優先(補助)?項目\)/,'').trim(), after:rest[rest.length-1]||''}); }
        else if(/優先/.test(measure)) summaryPrio.add(site);
      }
    }
  }
  // 第貳章優先項目段落（判斷類型的備援）
  const iPS=findIdx(lines,/^\(?\d?\)?\s*優先(示範|補助)項目/, iCh2>0?iCh2:0);
  const iPE=iPS>=0? findIdx(lines,/非優先(示範|補助)?項目/, iPS+1) : -1;
  const prioSectionType = iPS>=0? classifyType(lines.slice(iPS, iPE>iPS?iPE:iPS+40).join('')) : -1;

  // 第貳章各場址的改善說明句（例：(A)將既有…汰換為…），作為非優先「改善措施」
  const descMap={};
  if(siteSet.length && iCh2>0){
    let cs='', cp='';
    for(let i=iCh2;i<Math.min(lines.length,(iExe>0?iExe:lines.length));i++){
      const l=lines[i];
      if(/^(\d+\s*[.、]|[一二三四五六七八九十]+、)/.test(l)){ const st=siteSet.find(x=>l.includes(x)); if(st){ cs=st; cp=''; } }
      const pm=l.match(/(非)?優先(?:示範|補助)?項目/); if(pm && l.length<40) cp=pm[1]?'非優先':'優先';
      if(cs && cp && l.length<30 && /:$/.test(l) && !/項目|如下|計算|說明/.test(l) && !descMap['alt|'+cs+'|'+cp]) descMap['alt|'+cs+'|'+cp]=l.replace(/:$/,'');
      const dm=l.match(/^\(?[A-Za-z]\)\s*((?:將|汰換|更新|增設|新設).*)$/);
      if(dm && cs && cp && !descMap[cs+'|'+cp]){
        let t=dm[1]; for(let q=i+1;q<i+4 && !/[,。]/.test(t);q++) t+=lines[q];
        const cut=t.search(/[,。]/); descMap[cs+'|'+cp]=(cut>10?t.slice(0,cut):t).replace(/\s+/g,' ').trim();
      }
    }
  }

  // 各欄對應場址
  const P=[], N=[];
  if(energy){
    let sites=energy.siteToks.slice();
    if(sites.length!==energy.N){
      if(exeSeq.length===energy.N && exeSeq.every((x,q)=>x.prio===energy.prio[q])) sites=exeSeq.map(x=>x.site);
      else { sites=Array.from({length:energy.N},(_,q)=>energy.siteToks[q]||name||('項目'+(q+1)));
        if(energy.N>1) flag('warn','能源使用狀況表的欄位無法完整對應到場址，請確認各列「改善地點」。'); }
    }
    energy.sites=sites;
    const R=energy.R;
    for(let q=0;q<energy.N;q++){
      const isNP = energy.prio[q]==='非優先';
      const it={}; COLS[isNP?'非優先項目':'優先項目'].forEach(c=>it[c]='');
      it['申請用戶']=name; it['優先/非優先']=isNP?'非優先':'優先'; it['改善地點']=sites[q];
      it['改善前耗電量(度)']=R.pre[q]; it['改善前耗電量(kLOE)']=R.preK[q]; it['改善前耗能量(kLOE)']=0;
      it['改善後耗電量(度)']=R.post[q]; it['改善後耗電量(kLOE)']=R.postK[q]; it['改善後耗能量(kLOE)']=0;
      it._src='能源使用狀況表';
      if(isNP){
        const t=energy.colText[q].replace(/非優先(示範|補助)?項目/,'').trim();
        const hit=np.find(x=>x.site===sites[q]);
        const d=descMap[sites[q]+'|非優先']||descMap['alt|'+sites[q]+'|非優先'];
        it['改善措施']= hit? hit.measure+(hit.after?'：'+hit.after.replace(/\s+/g,' '):'') : (d? d : t);
        it._fromTable=true; N.push(it);
      } else {
        it['改善系統套數']=1;
        let ty=classifyType(energy.colText[q]); let how='表頭';
        if(ty<0 && prioSectionType>=0){ ty=prioSectionType; how='第貳章'; }
        if(ty<0 && /冰水主機/.test(energy.colText[q]) && /(一級能效|1級)/.test(flat)){ ty=5; how='全文'; }
        it['優先項目類型']= ty>=0? PRIORITY_TYPES[ty] : '';
        if(ty>=0 && how!=='表頭') flag('info',`「${sites[q]}」的優先項目類型由${how}文字判斷為「${PRIORITY_TYPES[ty]}」，請確認。`);
        if(AC_TYPES.includes(ty)) it['是否有含區域泵']= /區域(水)?泵/.test(all)?'是':(/一次側/.test(all)?'否':'');
        P.push(it);
      }
    }
    if(N.some(x=>x._fromTable)) flag('info','非優先項目的「改善措施」取自第貳章改善說明或能源使用狀況表欄位說明，請參考執行概要表確認是否完整。');
  }
  // 能源使用狀況表沒有非優先欄時，改由 Word 執行概要表建立非優先項目
  if(!N.length){
    np.forEach(x=>{ const it={}; COLS['非優先項目'].forEach(c=>it[c]=''); it['申請用戶']=name; it['優先/非優先']='非優先'; it['改善地點']=x.site;
      it['改善措施']=x.measure+(x.after?'：'+x.after.replace(/\s+/g,' '):''); it['改善前耗能量(kLOE)']=0; it['改善後耗能量(kLOE)']=0; it._src='執行概要表'; N.push(it); });
    if(N.length){
      flag('warn','非優先項目的改善前／後耗電量需依第貳章計算表手動填入（能源使用狀況表未拆分優先與非優先）。');
      P.forEach(p=>{ if(N.some(n=>n['改善地點']===p['改善地點'])) flag('warn',`「${p['改善地點']}」同時有非優先項目，能源使用狀況表的數值可能包含非優先部分，請依第貳章計算表拆分。`); });
      summaryNP.forEach(s=>{ if(!summaryPrio.has(s) && P.length>1){
        const other=P.filter(p=>!summaryPrio.has(p['改善地點']));
        if(other.length) flag('warn',`優先／非優先說法矛盾：執行概要表將「${s}」全部列為非優先，但能源使用狀況表將「${other.map(o=>o['改善地點']).join('、')}」列為優先項目（${other.map(o=>o['優先項目類型']).join('；')}）。請確認後刪除或調整對應列。`);
      }});
    }
  }
  if(budget.np && budget.np.total>0 && !N.length){ const it={}; COLS['非優先項目'].forEach(c=>it[c]=''); it['申請用戶']=name; it['優先/非優先']='非優先'; it['改善前耗能量(kLOE)']=0; it['改善後耗能量(kLOE)']=0; N.push(it);
    flag('warn','有非優先預算但無法辨識非優先項目，已新增一筆空白列，請手動填寫。'); }
  if(budget.p && budget.p.total>0 && !P.length) flag('warn','有優先預算但無法辨識優先項目，請手動新增。');

  // 優先經費依場址拆分
  const allocate=(rows,key,subKey,bud,subTotal,flagLabel)=>{
    if(!rows.length || !bud) return;
    if(rows.length===1){ rows[0][key]=bud.total; rows[0][subKey]=subTotal??''; return; }
    const region=lines.slice(bud.from+1,bud.to);
    const direct=rows.map(r=>{ let s=0; region.forEach(l=>{ const c=cells(l); const head=c[0].replace(/\s+/g,'');
      if(head===r['改善地點'].replace(/\s+/g,'') || new RegExp('^'+r['改善地點'].replace(/[()]/g,'\\$&')+'\\s').test(l)){ const v=nums(c.length>1?c.slice(1).join(' '):l.replace(r['改善地點'],'')); if(v.length) s+=v[0]; } }); return s; });
    const dsum=direct.reduce((a,b)=>a+b,0);
    if(!dsum){ rows[0][key]=bud.total; rows[0][subKey]=subTotal??''; rows.slice(1).forEach(r=>{r[key]=0;r[subKey]=0;}); flag('warn',`${flagLabel}預算表無法依場址拆分，已全數列於第一筆，請手動分配。`); return; }
    let acc=0, accS=0;
    rows.forEach((r,i)=>{ if(i===rows.length-1){ r[key]=bud.total-acc; r[subKey]= subTotal!=null? subTotal-accS : ''; return; }
      const v=Math.round(bud.total*direct[i]/dsum); r[key]=v; acc+=v; if(subTotal!=null){ const sv=Math.round(subTotal*direct[i]/dsum); r[subKey]=sv; accS+=sv; } });
    flag('info',`${flagLabel}經費依預算表場址直接費用拆分（${rows.map((r,i)=>r['改善地點']+' '+fmt(direct[i])).join('、')}），設計、管理、稅捐等共同費用按比例分攤。`);
  };
  allocate(P,'優先項目-專案經費(元)','優先項目-補助經費(元)',budget.p, sub.p!==undefined?sub.p:(M['優先補助總經費（元）']===''?null:M['優先補助總經費（元）']),'優先項目');
  if(P.some(p=>p['是否有含區域泵'])) flag('info','「是否有含區域泵」依全文是否提及區域泵判斷，請確認。');
  P.forEach(p=>{ if(!p['優先項目類型']) flag('warn',`「${p['改善地點']}」無法判斷優先項目類型，請手動選擇。`); });
  if(P.length) flag('info','容量欄位（改善後容量）無法自動判斷，請依計畫書填寫。');
  if(energy && energy.sites) {} 
  // 補助上限類型：改善場址 2 個以上即為集團
  const siteList=[...new Set([...P,...N].map(r=>(r['改善地點']||'').trim()).filter(x=>x && x!==name))];
  if(siteList.length>=2){ set('補助上限類型','集團',`${siteList.length} 個改善場址`); flag('info',`改善場址共 ${siteList.length} 個（${siteList.join('、')}），補助上限類型判定為集團。`,'補助上限類型'); }
  else set('補助上限類型','單一用戶', siteList.length? '1 個改善場址' : '未見多個改善場址');
  return { main:M, priority:P, nonPriority:N, flags, src, cap:capVal, fileName };
}

/* ---------- 檢核（可隨編輯重算） ---------- */
function computeTotals(c){
  const M=c.main; const n=(k)=>toNum(M[k])||0;
  M['優先方案數']=c.priority.length; M['非優先方案數']=c.nonPriority.length; M['總方案數']=c.priority.length+c.nonPriority.length;
  M['總計－專案總經費（元）']= n('優先專案總經費（元）')+n('非優先專案總經費（元）');
  M['總計－補助總經費（元）']= n('優先補助總經費（元）')+n('非優先補助總經費（元）');
}
function validate(c){
  computeTotals(c);
  const out=[]; const M=c.main; const w=(m,f)=>out.push({level:'warn',msg:m,field:f||null});
  const sumOf=(rows,k)=>rows.reduce((a,r)=>a+(toNum(r[k])||0),0);
  const pb=toNum(M['優先專案總經費（元）']);
  if(pb!==null && c.priority.length && Math.abs(sumOf(c.priority,'優先項目-專案經費(元)')-pb)>1) w(`優先項目經費加總 ${fmt(sumOf(c.priority,'優先項目-專案經費(元)'))} ≠ 優先專案總經費 ${fmt(pb)}。`,'優先專案總經費（元）');
  const ps=toNum(M['優先補助總經費（元）']);
  if(ps!==null && c.priority.length && Math.abs(sumOf(c.priority,'優先項目-補助經費(元)')-ps)>1) w(`優先項目補助加總 ${fmt(sumOf(c.priority,'優先項目-補助經費(元)'))} ≠ 優先補助總經費 ${fmt(ps)}。`,'優先補助總經費（元）');
  if(c.cap && toNum(M['總計－補助總經費（元）'])>c.cap) out.push({level:'info',msg:`補助加總 ${fmt(M['總計－補助總經費（元）'])} 超過文件載明上限 ${fmt(c.cap)}（匯出時於該欄加註）。`,field:'總計－補助總經費（元）'});
  [...c.priority.map(r=>['優先',r]),...c.nonPriority.map(r=>['非優先',r])].forEach(([t,r])=>{
    const a=toNum(r['改善前耗電量(度)']), b=toNum(r['改善後耗電量(度)']), ak=toNum(r['改善前耗電量(kLOE)']), bk=toNum(r['改善後耗電量(kLOE)']);
    const lab=`${t}「${r['改善地點']||'未命名'}」`;
    if(a!==null&&b!==null&&b>=a) w(`${lab}改善後耗電量（${fmt(b)}）不小於改善前（${fmt(a)}）。`);
    [[a,ak,'改善前'],[b,bk,'改善後']].forEach(([k,l,s])=>{ if(k&&l){ const r2=l/(k*KLOE_PER_KWH); if(r2<0.95||r2>1.05) w(`${lab}${s}度數與 kLOE 換算不一致（${fmt(k)} 度 ≈ ${(k*KLOE_PER_KWH).toFixed(2)} kLOE，填寫 ${fmt(l)}）。`); } });
  });
  const sv=toNum(M['節約用電量(kWh/年)']); const co=toNum(M['tCO2減量(噸/年)']);
  if(sv&&co){ const e=sv*0.474/1000; if(Math.abs(e-co)/e>0.02) w(`CO2 減量 ${fmt(co)} 與節約用電量換算值 ${e.toFixed(2)} 噸（0.474 kg/度）不一致。`,'tCO2減量(噸/年)'); }
  const all=[...c.priority,...c.nonPriority];
  if(sv && all.length && all.every(r=>toNum(r['改善前耗電量(度)'])!==null&&toNum(r['改善後耗電量(度)'])!==null)){
    const d=all.reduce((a,r)=>a+toNum(r['改善前耗電量(度)'])-toNum(r['改善後耗電量(度)']),0);
    if(Math.abs(d-sv)>1) w(`各項目節電量加總 ${fmt(d)} ≠ 節約用電量 ${fmt(sv)}。`,'節約用電量(kWh/年)');
  }
  const sl=[...new Set([...c.priority,...c.nonPriority].map(r=>(r['改善地點']||'').trim()).filter(x=>x && x!==M['單位名稱']))];
  const expT = sl.length>=2 ? '集團' : '單一用戶';
  if(M['補助上限類型'] && M['補助上限類型']!==expT && sl.length) w(`項目表中有 ${sl.length} 個改善場址${sl.length>=2?'（'+sl.join('、')+'）':''}，補助上限類型應為「${expT}」，目前為「${M['補助上限類型']}」。`,'補助上限類型');
  const inst=['第一期','第二期','第三期'].reduce((a,k)=>a+(toNum(M[k+'補助款（元）'])||0),0);
  const tot=toNum(M['總計－補助總經費（元）']);
  if(inst && tot && Math.abs(inst-tot)>1 && !(c.cap && Math.abs(inst-c.cap)<=1)) w(`分期補助款加總 ${fmt(inst)} ≠ 總計補助經費 ${fmt(tot)}。`,'第一期補助款（元）');
  return out;
}

/* ===== 介面 ===== */
const PDFJS_BASE='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'build/pdf.worker.min.js';

const state={cases:[],active:-1};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}

const GROUPS=[
 ['基本資料',['案件編號','年度','批次','單位名稱','補助上限類型','行業別類別','行業別小分類','行業別其他','統一編號','中小企業','單位地址','單位地址鄉鎮區','單位地址街道路號','是否位於工業區','園區類型','園區','工廠登記證號']],
 ['負責人',['負責人','負責人職稱','負責人電話','負責人Email']],
 ['聯絡人',['聯絡人','聯絡人職稱','聯絡人電話','聯絡人手機','聯絡人傳真','聯絡人Email','聯絡人地址縣市','聯絡人地址鄉鎮區','聯絡人地址街道路號']],
 ['節能效益與用電',['承諾節能率(%)','節約用電量(kWh/年)','節省油當量(kLOE/年)','tCO2減量(噸/年)','節約金額(元/年)','總用電度(度/年)','總電費(元/年)']],
 ['經費',['優先專案總經費（元）','優先補助總經費（元）','非優先專案總經費（元）','非優先補助總經費（元）','總計－專案總經費（元）','總計－補助總經費（元）','優先方案數','非優先方案數','總方案數']],
 ['分期補助款',['第一期補助款（元）','第一期預定時間','第二期補助款（元）','第二期預定時間','第三期補助款（元）','第三期預定時間']],
 ['不自動產出',['舊機作為備機','分期付款','分期年數','改善項目備註']]
];
const MFG_ONLY=['是否位於工業區','園區類型','園區','工廠登記證號'];
const WIDE=['單位名稱','單位地址街道路號','聯絡人地址街道路號','負責人Email','聯絡人Email','改善項目備註'];
const SELECTS={'補助上限類型':['單一用戶','集團'],'中小企業':['是','否'],'是否位於工業區':['是','否'],'舊機作為備機':['是','否'],'分期付款':['是','否']};

/* ---------- 讀檔 ---------- */
async function readFile(file){
  const buf=await file.arrayBuffer();
  const ext=file.name.toLowerCase().split('.').pop();
  if(ext==='docx'){ const r=await mammoth.convertToHtml({arrayBuffer:buf}); return htmlToLines(r.value); }
  if(ext==='pdf'){
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf),cMapUrl:PDFJS_BASE+'cmaps/',cMapPacked:true,standardFontDataUrl:PDFJS_BASE+'standard_fonts/'}).promise;
    let L=[]; for(let p=1;p<=doc.numPages;p++){ const pg=await doc.getPage(p); const tc=await pg.getTextContent(); L=L.concat(pdfItemsToLines(tc.items)); }
    if(L.length<30) throw new Error('這份 PDF 幾乎沒有文字層，可能是掃描檔，無法抽取。');
    return L;
  }
  if(ext==='doc') throw new Error('不支援舊版 .doc，請在 Word 另存為 .docx 後再上傳。');
  throw new Error('只支援 .docx 與 .pdf。');
}
async function handleFiles(files){
  for(const f of files){
    $('#busy').textContent='讀取中：'+f.name;
    try{
      const lines=await readFile(f);
      const c=extract(lines,f.name);
      if(!c.main['單位名稱']) c.flags.unshift({level:'warn',msg:'找不到單位名稱，這份文件可能不是計畫書範本格式。',field:'單位名稱'});
      const key=c.main['統一編號']||c.main['單位名稱']||f.name;
      const i=state.cases.findIndex(x=>(x.main['統一編號']||x.main['單位名稱']||x.fileName)===key);
      if(i>=0){ state.cases[i]=c; state.active=i; toast('已覆蓋：'+(c.main['單位名稱']||f.name)); }
      else { state.cases.push(c); state.active=state.cases.length-1; toast('已匯入：'+(c.main['單位名稱']||f.name)); }
    }catch(e){ console.error(e); toast(f.name+'：'+(e.message||'讀取失敗')); }
  }
  $('#busy').textContent='';
  renderAll();
}

/* ---------- 畫面 ---------- */
function renderAll(){ renderCases(); renderMain(); $('#exportBtn').disabled=!state.cases.length; }
function renderCases(){
  $('#cases').innerHTML=state.cases.map((c,i)=>{
    const n=[...c.flags,...validate(c)].filter(f=>f.level==='warn').length;
    return `<li class="${i===state.active?'active':''}" data-i="${i}" tabindex="0">
      <button class="del" data-del="${i}" title="移除此案件" aria-label="移除">×</button>
      <div class="nm">${esc(c.main['單位名稱']||'（未辨識單位）')}</div>
      <div class="fn">${esc(c.fileName)}</div>
      <span class="badge ${n?'':'ok'}">${n?n+' 項待確認':'無待確認'}</span></li>`;}).join('');
}
function fieldHTML(c,k){
  const v=c.main[k]; const manual=MANUAL_ONLY.includes(k); const comp=COMPUTED.includes(k);
  const mfgHidden=MFG_ONLY.includes(k) && c.main['行業別類別']!=='製造業' && v==='';
  let cls='f'+(manual||mfgHidden?' manual':'')+(comp?' computed':'')+(WIDE.includes(k)?' wide':'');
  const src=c.src[k]?`<span class="src">${esc(c.src[k])}</span>`:'';
  const ph= manual?'不自動產出': mfgHidden?'製造業才產出': (v===''&&!comp?'文件未載明':'');
  let input;
  if(k==='行業別類別'){ input=`<select data-k="${k}"><option value=""></option>${Object.keys(INDUSTRY).map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`; }
  else if(k==='行業別小分類'){ const opts=INDUSTRY[c.main['行業別類別']]||[]; input=`<select data-k="${k}"><option value=""></option>${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}${v&&!opts.includes(v)?`<option selected>${esc(v)}</option>`:''}</select>`; }
  else if(SELECTS[k]){ input=`<select data-k="${k}"><option value=""></option>${SELECTS[k].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`; }
  else { const disp = comp||NUMERIC_MAIN.includes(k) ? (v===''?'':String(v)) : v;
    input=`<input data-k="${k}" value="${esc(disp)}" placeholder="${ph}" ${comp?'readonly tabindex="-1"':''} ${NUMERIC_MAIN.includes(k)?'inputmode="decimal"':''}>`; }
  return `<div class="${cls}" data-field="${esc(k)}"><label><span>${esc(k)}</span>${src}</label>${input}</div>`;
}
const P_COLS=[['改善地點','w-m'],['優先項目類型','w-xl'],['改善前耗電量(度)','w-s num'],['改善前耗電量(kLOE)','w-s num'],['改善前耗能量(kLOE)','w-s num'],['改善後耗電量(度)','w-s num'],['改善後耗電量(kLOE)','w-s num'],['改善後耗能量(kLOE)','w-s num'],['改善系統套數','w-xs num'],['合計容量','w-s num'],['優先項目-專案經費(元)','w-m num'],['優先項目-補助經費(元)','w-m num'],['1級冰水機組合計容量(RT)','w-s num'],['是否有含區域泵','w-xs'],['空調系統合計容量(RT)','w-s num'],['空壓系統合計容量(HP)','w-s num'],['熱水系統合計容量(kW)','w-s num'],['冷凍(藏)庫合計容量(RT)','w-s num'],['承諾之再節電量(kWh/年)','w-s num'],['人工智慧機械設備系統合計容量(kW)','w-s num'],['績效指標','w-m manual'],['內容概要描述','w-m manual']];
const N_COLS=[['改善地點','w-m'],['改善措施','w-xl'],['改善前耗電量(度)','w-s num'],['改善前耗電量(kLOE)','w-s num'],['改善前耗能量(kLOE)','w-s num'],['改善後耗電量(度)','w-s num'],['改善後耗電量(kLOE)','w-s num'],['改善後耗能量(kLOE)','w-s num']];
function tableHTML(rows,cols,kind){
  const head=`<tr><th>#</th>${cols.map(([k])=>`<th>${esc(k)}</th>`).join('')}<th></th></tr>`;
  const body=rows.map((r,i)=>`<tr><td>${i+1}</td>${cols.map(([k,w])=>{
    const v=r[k]??''; const man=w.includes('manual');
    let inner;
    if(k==='優先項目類型') inner=`<select data-t="${kind}" data-r="${i}" data-k="${k}"><option value=""></option>${PRIORITY_TYPES.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(k==='是否有含區域泵') inner=`<select data-t="${kind}" data-r="${i}" data-k="${k}"><option value=""></option>${['是','否'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(k==='改善措施') inner=`<textarea data-t="${kind}" data-r="${i}" data-k="${k}" rows="2">${esc(v)}</textarea>`;
    else inner=`<input data-t="${kind}" data-r="${i}" data-k="${k}" value="${esc(v)}" ${man?'placeholder="不自動產出"':''}>`;
    return `<td class="${w}">${inner}</td>`;}).join('')}<td><button class="btn ghost small" data-delrow="${kind}" data-r="${i}" aria-label="刪除此列">刪除</button></td></tr>`).join('');
  return `<div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body||`<tr><td colspan="${cols.length+2}" style="padding:12px;color:var(--muted)">沒有項目</td></tr>`}</tbody></table></div>
  <div class="tbl-actions"><button class="btn small" data-addrow="${kind}">新增一列</button></div>`;
}
function renderMain(){
  const c=state.cases[state.active];
  if(!c){ $('#main').innerHTML=$('#main').dataset.empty||$('#main').innerHTML; return; }
  if(!$('#main').dataset.empty) $('#main').dataset.empty=$('#main').innerHTML;
  computeTotals(c);
  $('#main').innerHTML=`
   <div class="case-head"><h2>${esc(c.main['單位名稱']||'（未辨識單位）')}</h2><span class="file">${esc(c.fileName)}</span></div>
   <details class="checks" open><summary>待確認事項 <span class="n" id="checkCount"></span></summary><ul id="checkList"></ul></details>
   ${GROUPS.map(([g,ks])=>`<section class="block"><h3>${g}</h3><div class="grid">${ks.map(k=>fieldHTML(c,k)).join('')}</div></section>`).join('')}
   <section class="block"><h3>優先項目（${c.priority.length}）</h3>${tableHTML(c.priority,P_COLS,'p')}</section>
   <section class="block"><h3>非優先項目（${c.nonPriority.length}）</h3>${tableHTML(c.nonPriority,N_COLS,'n')}</section>`;
  refreshChecks();
}
function refreshChecks(){
  const c=state.cases[state.active]; if(!c) return;
  const live=validate(c);
  const all=[...c.flags.map(f=>({...f,live:false})),...live.map(f=>({...f,live:true}))];
  const warn=all.filter(f=>f.level==='warn').length;
  $('#checkCount').textContent=`${warn} 項警示、${all.length-warn} 項說明`;
  $('#checkList').innerHTML=all.length? all.map(f=>`<li class="${f.level}${f.live?' live':''}">${esc(f.msg)}${f.live?'<span class="tag">即時檢核</span>':''}</li>`).join('') : '<li class="info">沒有待確認事項。</li>';
  document.querySelectorAll('.f').forEach(el=>el.classList.toggle('flagged', all.some(f=>f.field===el.dataset.field && f.level==='warn')));
  ['總計－專案總經費（元）','總計－補助總經費（元）','優先方案數','非優先方案數','總方案數'].forEach(k=>{ const i=document.querySelector(`input[data-k="${k}"]`); if(i) i.value=c.main[k]; });
  renderCases();
}

/* ---------- 事件 ---------- */
const drop=$('#drop'), fileIn=$('#file');
drop.addEventListener('click',()=>fileIn.click());
drop.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fileIn.click(); }});
fileIn.addEventListener('change',()=>{ handleFiles([...fileIn.files]); fileIn.value=''; });
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>handleFiles([...e.dataTransfer.files]));

$('#cases').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]'); if(d){ e.stopPropagation(); const i=+d.dataset.del; if(!confirm('移除「'+(state.cases[i].main['單位名稱']||state.cases[i].fileName)+'」？')) return;
    state.cases.splice(i,1); state.active=Math.min(state.active,state.cases.length-1); renderAll(); return; }
  const li=e.target.closest('li'); if(li){ state.active=+li.dataset.i; renderAll(); }
});
$('#cases').addEventListener('keydown',e=>{ const li=e.target.closest('li'); if(li&&e.key==='Enter'){ state.active=+li.dataset.i; renderAll(); }});

let tmr;
$('#main').addEventListener('input',e=>{
  const el=e.target, c=state.cases[state.active]; if(!c||!el.dataset.k) return;
  const k=el.dataset.k;
  if(el.dataset.t){ const rows=el.dataset.t==='p'?c.priority:c.nonPriority; rows[+el.dataset.r][k]=el.value; }
  else { c.main[k]=el.value; delete c.src[k];
    if(k==='行業別類別'){ c.main['行業別小分類']=''; renderMain(); return; } }
  clearTimeout(tmr); tmr=setTimeout(refreshChecks,250);
});
$('#main').addEventListener('change',e=>{ if(e.target.tagName==='SELECT') refreshChecks(); });
$('#main').addEventListener('click',e=>{
  const c=state.cases[state.active]; if(!c) return;
  const a=e.target.closest('[data-addrow]');
  if(a){ const kind=a.dataset.addrow; const cols=COLS[kind==='p'?'優先項目':'非優先項目']; const r={}; cols.forEach(k=>r[k]='');
    r['優先/非優先']=kind==='p'?'優先':'非優先'; r['改善系統套數']=kind==='p'?1:''; r['改善前耗能量(kLOE)']=0; r['改善後耗能量(kLOE)']=0; if(kind!=='p') delete r['改善系統套數'];
    (kind==='p'?c.priority:c.nonPriority).push(r); renderMain(); return; }
  const d=e.target.closest('[data-delrow]');
  if(d){ (d.dataset.delrow==='p'?c.priority:c.nonPriority).splice(+d.dataset.r,1); renderMain(); }
});

/* ---------- 匯出 ---------- */
function cellVal(k,v,numericList){ if(v===''||v===null||v===undefined) return null; if(numericList.includes(k)){ const n=toNum(v); return n===null? String(v): n; } return String(v); }
function sheetFrom(title,cols,rows,numericList){
  const aoa=[[title],cols,...rows.map(r=>cols.map(k=>cellVal(k,r[k],numericList)))];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:cols.length-1}}];
  ws['!cols']=cols.map(k=>({wch:Math.max(10,Math.min(40,k.length*2+2))}));
  return ws;
}
$('#exportBtn').addEventListener('click',()=>{
  if(!state.cases.length) return;
  state.cases.forEach(computeTotals);
  const wb=XLSX.utils.book_new();
  const mainRows=state.cases.map(c=>c.main);
  const wsMain=sheetFrom('ESPC案件列表',COLS.main,mainRows,NUMERIC_MAIN);
  const capCol=COLS.main.indexOf('總計－補助總經費（元）');
  state.cases.forEach((c,i)=>{ if(c.cap){ const ref=XLSX.utils.encode_cell({r:i+2,c:capCol}); if(!wsMain[ref]) wsMain[ref]={t:'s',v:''};
    wsMain[ref].c=[{a:'ESPC匯入工具',t:`文件載明補助上限 ${fmt(c.cap)} 元`}]; wsMain[ref].c.hidden=true; }});
  XLSX.utils.book_append_sheet(wb,wsMain,'ESPC案件列表');
  const withCase=(c,rows)=>rows.map(r=>({...r,'案號':c.main['案件編號']||'','申請用戶':c.main['單位名稱']}));
  XLSX.utils.book_append_sheet(wb,sheetFrom('優先項目',COLS['優先項目'],state.cases.flatMap(c=>withCase(c,c.priority)),NUMERIC_ITEM),'優先項目');
  XLSX.utils.book_append_sheet(wb,sheetFrom('非優先項目',COLS['非優先項目'],state.cases.flatMap(c=>withCase(c,c.nonPriority)),NUMERIC_ITEM),'非優先項目');
  if($('#withChecks').checked){
    const rows=[['單位名稱','來源檔案','類別','內容']];
    state.cases.forEach(c=>[...c.flags,...validate(c)].forEach(f=>rows.push([c.main['單位名稱'],c.fileName,f.level==='warn'?'警示':'說明',f.msg])));
    const ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=[{wch:30},{wch:36},{wch:6},{wch:100}];
    XLSX.utils.book_append_sheet(wb,ws,'檢核提醒');
  }
  const d=new Date(); const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  XLSX.writeFile(wb,`ESPC案件列表_${ds}.xlsx`);
  toast('已匯出 '+state.cases.length+' 個案件');
});
</script>
